name: CI

# The NDI SDK is proprietary. The SDK jobs install it with the
# .github/actions/ndi-sdk action, which downloads it from NDI's public site
# (accepting the NDI SDK license) and caches the download between runs:
# Linux and macOS test against it, and Android and iOS devices build against
# it (the iOS simulator has no NDI slice and builds without). Windows tests
# without the SDK, the way a machine without it builds: build.rs warns,
# AVAILABLE is false and the SDK tests skip. The tests that find a sender
# through NDI discovery need multicast and are #[ignore]d; run them with
# --ignored on a machine with the SDK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}${{ matrix.sdk == '' && ', no SDK' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sdk: linux
          - os: macos-latest
            sdk: apple
          - os: windows-latest
            sdk: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ndi-sdk
        if: matrix.sdk != ''
        with:
          platform: ${{ matrix.sdk }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  android:
    name: Android build (arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ndi-sdk
        with:
          platform: android
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk --platform 34 -t arm64-v8a -t armeabi-v7a build --all-targets

  ios:
    name: iOS build (device and simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ndi-sdk
        with:
          platform: apple
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target aarch64-apple-ios
      - run: cargo build --target aarch64-apple-ios-sim
